name: nusadhipa_customer_mobile
description: NUSA-DHIPA Customer Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.2
  pdf: ^3.11.1
  printing: ^5.13.2
  path_provider: ^2.1.4
  share_plus: ^10.0.0
  intl: ^0.20.2
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  http_parser: ^4.1.0
  shared_preferences: ^2.3.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.2
  geocoding: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

dependency_overrides:
  archive: ^4.5.1

flutter:
  uses-material-design: true

  assets:
    - assets/branding/header_marketplace.jpg
    - assets/branding/logo_nusadhipa.png
    - assets/branding/sauri_logo.png
    - assets/branding/Fresh Poultry Processing Showcase.png